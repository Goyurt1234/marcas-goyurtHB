<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Registro de marcas de ingreso y salida para la carga masiva en GeoVictoria.">
<meta name="robots" content="noindex">
<title>Marcas Goyurt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: una "app" de una columna, con borde de trazo como los personajes, sobre un fondo menta con los personajes flotando alrededor */
:root{
  --menta:#eef8f7; --blanco:#ffffff; --teal:#6cc0bd; --teal-hondo:#2b827e; --teal-suave:#e3f3f2;
  --uva:#8e4fb5; --uva-suave:#f2eaf8; --manzana:#a6cc2e; --manzana-suave:#f1f7dc;
  --tinta:#1f2b2e; --gris:#6d7b7d; --linea:#e2ecec; --finde:#f5f7f7; --error:#c2412d;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --texto:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--menta);color:var(--tinta);font-family:var(--texto);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  overflow-x:hidden;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.rueda:focus-visible{outline:3px solid var(--uva);outline-offset:2px}

.deco{position:fixed;pointer-events:none;z-index:0}
.deco img{display:block;width:100%}
.d1{width:84px;left:6%;top:16%}.d2{width:150px;left:9%;bottom:6%}.d3{width:96px;right:10%;bottom:9%}.d4{width:92px;right:8%;top:22%}
@media (max-width:820px){.deco{display:none}}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;background:var(--blanco);border:2px solid var(--tinta);border-radius:30px;
  min-height:min(760px,calc(100vh - 48px));display:flex;flex-direction:column;overflow:hidden}
.cab{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.cab .goy{height:36px;width:auto}
.cab .sep{width:1px;height:26px;background:var(--linea)}
.cab .geo{height:24px;width:auto}
.cab .mini{height:34px;width:auto;margin-left:auto}

.pasos{display:flex;gap:6px;padding:4px 20px 0}
.paso{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--gris);font-weight:600;text-align:left;padding:0}
.paso i{height:5px;border-radius:5px;background:var(--linea);display:block;transition:background .35s}
.paso.hecho i,.paso.activo i{background:var(--teal)}
.paso.activo{color:var(--teal-hondo)}
.paso:disabled{cursor:default}

.vista{flex:1;display:flex;flex-direction:column;padding:18px 20px 0;animation:entra .45s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--gris);margin:0 0 16px}

/* calendario */
.cal{border:1px solid var(--linea);border-radius:16px;padding:10px;background:var(--blanco)}
.cal-cab{display:flex;align-items:center;justify-content:space-between;color:var(--teal);padding:2px 4px 10px}
.cal-cab button{width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--teal);display:grid;place-items:center}
.cal-cab button:hover{background:var(--teal-suave)}
.cal-mes{font-family:var(--display);font-weight:600;font-size:19px;color:var(--teal-hondo);display:flex;gap:6px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--linea);border-left:1px solid var(--linea)}
.cal-grid>*{border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);aspect-ratio:1.15;display:grid;place-items:center;font-size:15px}
.dsem{color:var(--teal);font-size:14px;aspect-ratio:auto!important;padding:6px 0}
.dia{color:var(--teal-hondo);font-weight:600;position:relative}
.dia span{width:38px;height:34px;display:grid;place-items:center;border-radius:18px;transition:background .2s,transform .2s}
.dia:hover span{background:var(--teal-suave)}
.dia.finde{background:var(--finde);color:#79c6c3}
.dia.otro{color:#a3abad;font-weight:400}
.dia.hoy span{box-shadow:inset 0 -2px 0 var(--teal)}
.dia.fut,.dia.fut.finde,.dia.fut.otro{color:#c3c9ca;font-weight:400;cursor:not-allowed;background:#fafbfb}
.dia.fut:hover span{background:none}
.dia.sel span{background:var(--teal);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* puntos */
.buscar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--linea);border-radius:22px;padding:0 14px;height:46px;margin-bottom:12px}
.buscar:focus-within{border-color:var(--teal)}
.buscar input{border:0;outline:0;flex:1;font:inherit;font-size:16px;background:none;min-width:0}
.recientes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--teal-suave);color:var(--teal-hondo);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.chip:hover{background:#d3eceb}
.lista{flex:1;overflow-y:auto;max-height:340px;margin:0 -6px;padding:0 6px}
.pv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:14px;text-align:left}
.pv:hover{background:var(--finde)}
.pv b{font-family:var(--display);font-weight:500;font-size:13px;background:var(--teal-suave);color:var(--teal-hondo);border-radius:10px;min-width:44px;text-align:center;padding:5px 0;font-variant-numeric:tabular-nums}
.pv span{flex:1;min-width:0}
.pv.sel{background:var(--teal);color:#fff}
.pv.sel b{background:#fff}
.vacio-lista{color:var(--gris);padding:18px 6px}

.pie{padding:14px 0 18px;position:relative;z-index:2;display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:26px;background:var(--teal);color:#fff;font-family:var(--display);font-size:18px;font-weight:500;transition:transform .15s,background .2s}
.btn:hover{background:#5bb3b0}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--teal-suave);color:var(--teal-hondo);flex:0 0 auto;padding:0 18px}
.aviso{color:var(--error);font-size:13px;min-height:18px;margin:6px 2px 0}

.escena{position:relative;height:120px;margin:4px -20px 0;pointer-events:none;overflow:hidden}
.escena img{position:absolute;bottom:0}
.e-yog{left:14px;height:118px;bottom:-12px!important}
.e-uva{left:126px;height:52px;bottom:8px!important}
.e-man{right:18px;height:96px}

/* marcas */
.banda{background:var(--teal);color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.banda .txt{flex:1;min-width:0}
.banda .f{font-family:var(--display);font-size:19px;font-weight:500;line-height:1.2}
.banda .p{font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banda button{background:rgba(255,255,255,.22);color:#fff;border-radius:16px;padding:6px 11px;font-size:13px;font-weight:700}
.banda button:hover{background:rgba(255,255,255,.35)}
.resumen{display:flex;gap:8px;margin:14px 0 6px;color:var(--gris);font-size:13px;flex-wrap:wrap}
.resumen b{color:var(--tinta)}
.marcas{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-bottom:84px}
.marca{display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px 10px 10px 12px;animation:cae .5s cubic-bezier(.3,1.4,.5,1) both;text-align:left;width:100%}
@keyframes cae{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.marca.ing{background:var(--teal-suave)}
.marca.sal{background:var(--uva-suave)}
.marca img{width:38px;height:38px;object-fit:contain}
.marca .info{flex:1;min-width:0}
.marca .t{font-weight:700}
.marca .c{font-size:13px;color:var(--gris);font-variant-numeric:tabular-nums}
.marca .com{font-size:12px;color:var(--gris);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca .hora{font-family:var(--display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.marca.ing .hora{color:var(--teal-hondo)}.marca.sal .hora{color:var(--uva)}
.borrar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--gris);font-size:18px}
.borrar:hover{background:rgba(0,0,0,.06);color:var(--error)}
.vacio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:10px 0 90px}
.vacio img{height:120px}
.vacio h2{font-family:var(--display);font-weight:500;font-size:20px;margin:6px 0 0}
.vacio p{color:var(--gris);margin:0}
.fab{position:absolute;right:20px;bottom:86px;width:62px;height:62px;border-radius:50%;background:var(--uva);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center;z-index:3;border:2px solid var(--tinta);transition:transform .2s}
.fab:hover{transform:scale(1.07) rotate(90deg)}
.barra{position:absolute;left:20px;right:20px;bottom:18px;z-index:3;display:flex}

/* hoja nueva marca */
.velo{position:absolute;inset:0;background:rgba(31,43,46,.35);z-index:5;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.hoja{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--blanco);border-radius:28px 28px 0 0;border-top:2px solid var(--tinta);
  padding:10px 20px 18px;max-height:94%;overflow-y:auto;animation:sube .4s cubic-bezier(.2,.9,.25,1)}
@keyframes sube{from{transform:translateY(100%)}}
.asa{width:44px;height:5px;border-radius:5px;background:var(--linea);margin:0 auto 10px}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hoja-cab h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.cerrar{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--gris)}
.cerrar:hover{background:var(--finde)}
.campo{margin-top:14px}
.campo label,.etq{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--tinta)}
.campo .opc{font-weight:400;color:var(--gris)}
.inp{width:100%;height:50px;border:1.5px solid var(--linea);border-radius:16px;padding:0 14px;font:inherit;font-size:20px;font-family:var(--display);letter-spacing:.5px;outline:0}
.inp.com{font-family:var(--texto);font-size:15px;letter-spacing:0}
.inp:focus{border-color:var(--teal)}
.inp.mal{border-color:var(--error)}
.cedulas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cedulas .chip{font-variant-numeric:tabular-nums}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{border:1.5px solid var(--linea);border-radius:20px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:17px;font-weight:500;transition:all .2s}
.tipo img{height:62px;transition:transform .3s}
.tipo:hover img{transform:translateY(-4px)}
.tipo[aria-pressed="true"].i{border:2px solid var(--teal);background:var(--teal-suave);color:var(--teal-hondo)}
.tipo[aria-pressed="true"].s{border:2px solid var(--uva);background:var(--uva-suave);color:var(--uva)}
.tipo[aria-pressed="true"] img{animation:baila .9s ease-in-out infinite}
@keyframes baila{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-5px)}}
.reloj{display:flex;align-items:center;justify-content:center;gap:6px;position:relative;border:1.5px solid var(--linea);border-radius:20px;padding:4px 0}
.reloj::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:44px;transform:translateY(-50%);background:var(--teal-suave);border-radius:14px;z-index:0}
.rueda{position:relative;z-index:1;height:132px;width:76px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;border-radius:12px;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.rueda::-webkit-scrollbar{display:none}
.rueda div{height:44px;line-height:44px;scroll-snap-align:center;font-family:var(--display);font-size:26px;color:#9fb0b1;font-variant-numeric:tabular-nums;cursor:pointer}
.rueda div.on{color:var(--teal-hondo);font-weight:600}
.rueda .pad{height:44px;cursor:default}
.dos{position:relative;z-index:1;font-family:var(--display);font-size:28px;color:var(--teal-hondo)}
.atajos{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}

.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--tinta);color:#fff;border-radius:20px;padding:9px 16px;font-size:14px;z-index:8;white-space:nowrap;animation:tst 2.6s both}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.confirma{background:var(--finde);border-radius:16px;padding:12px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.confirma span{flex:1;min-width:160px}
.confirma button{border-radius:14px;padding:7px 12px;font-weight:700}
.confirma .si{background:var(--error);color:#fff}
.confirma .no{background:var(--blanco)}

.bob{animation:bob 2s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out .5s infinite}
.wig{animation:wig 1.6s ease-in-out infinite}.wave{animation:wave 1.2s ease-in-out infinite;transform-origin:50% 90%}
.flota{animation:flota 6s ease-in-out infinite}.flota2{animation:flota 7s ease-in-out 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
@keyframes flota{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(8px,-16px) rotate(5deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:480px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .app{border-radius:0;border:0;min-height:100vh}
  .cab,.pasos,.vista{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="deco d1 flota" aria-hidden="true"><img data-k="uva1" alt=""></div>
<div class="deco d2 wave" aria-hidden="true"><img data-k="yog" alt=""></div>
<div class="deco d3 bob2" aria-hidden="true"><img data-k="uva2" alt=""></div>
<div class="deco d4 flota2" aria-hidden="true"><img data-k="man" alt=""></div>

<style>
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tecla{height:58px;border-radius:20px;background:var(--finde);font-family:var(--display);font-size:26px;font-weight:500;color:var(--teal-hondo);transition:transform .12s,background .2s}
.tecla:hover{background:var(--teal-suave)}
.tecla:active{transform:scale(.92);background:var(--teal);color:#fff}
.tecla.bor{font-size:20px;color:var(--gris)}
.ced{font-family:var(--display);font-size:34px;font-weight:500;text-align:center;letter-spacing:1px;height:66px;font-variant-numeric:tabular-nums}
.ced-saludo{display:flex;align-items:center;gap:12px}
.ced-saludo img{height:74px;flex:0 0 auto}
.banda .cc{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.persona{display:flex;align-items:center;gap:12px;border:1.5px solid var(--linea);border-radius:18px;padding:12px;animation:cae .5s cubic-bezier(.3,1.4,.5,1) both}
.persona .info{flex:1;min-width:0;text-align:left}
.persona .cc{font-family:var(--display);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.persona .lug{font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .mk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mk span{border-radius:12px;padding:3px 9px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.mk .i{background:var(--teal-suave);color:var(--teal-hondo)}.mk .s{background:var(--uva-suave);color:var(--uva)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--teal-suave);display:grid;place-items:center;flex:0 0 auto}
.avatar img{height:34px}
.final{display:flex;flex-direction:column;gap:10px;padding:14px 0 18px}
.btn.otro{background:var(--blanco);color:var(--uva);border:2px solid var(--uva);display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;height:56px}
.btn.otro:hover{background:var(--uva-suave)}
.btn.otro img{height:34px}
.btn.descargar{flex:0 0 auto;height:56px}
.fallback{background:var(--manzana-suave);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.fallback button{align-self:flex-start;background:var(--tinta);color:#fff;border-radius:14px;padding:8px 14px;font-weight:700}
.personas{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.celebra{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:86px;margin:2px 0 6px}
.celebra img{height:70px}.celebra img:nth-child(2){height:86px}
</style>

<main class="app" id="app">
  <header class="cab">
    <img class="goy" data-k="goyurt" alt="Goyurt">
    <span class="sep" aria-hidden="true"></span>
    <img class="geo" data-k="geo" alt="GeoVictoria">
    <img class="mini bob" data-k="uva1" alt="" aria-hidden="true">
  </header>
  <nav class="pasos" aria-label="Pasos">
    <button class="paso" id="p0" type="button"><i></i>1 · Cédula</button>
    <button class="paso" id="p1" type="button"><i></i>2 · Día</button>
    <button class="paso" id="p2" type="button"><i></i>3 · Punto</button>
    <button class="paso" id="p3" type="button"><i></i>4 · Marcas</button>
  </nav>
  <div id="vista" style="flex:1;display:flex;flex-direction:column"></div>
</main>

function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function deYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fechaLarga(s) { const d = deYmd(s); return DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1) + " " + d.getDate() + " de " + MESES[d.getMonth()]; }
function fechaCorta(s) { const d = deYmd(s); return DIAS[d.getDay()].slice(0, 3) + " " + d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); }
function nombrePunto(p) { const i = p.indexOf(" "); const n = p.slice(i + 1).toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/\bCc\b/g, "CC").replace(/\bLc\b/g, "LC"); return { cod: p.slice(0, i), nom: n }; }
function cedFmt(c) { return String(c).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

function cambiarActual(campo, valor) {

}
function personas() {
  const g = new Map();
  S.marcas.forEach(m => { const k = m.cc + "|" + m.fecha + "|" + m.punto; if (!g.has(k)) g.set(k, { cc: m.cc, fecha: m.fecha, punto: m.punto, marcas: [] }); g.get(k).marcas.push(m); });

}

function puede(n) {

    </div>
    <p class="aviso" id="av"></p>
    <div class="escena" aria-hidden="true"><img class="e-yog wave" data-k="yog" alt=""><img class="e-uva bob" data-k="uva2" alt=""><img class="e-man wig" data-k="man" alt=""></div>
    <div class="pie"><button class="btn sec" id="atr" type="button">Atrás</button><button class="btn" id="sig" type="button">Continuar</button></div>`;
  const pinta = () => {
    const [y, m] = S.mesVista.split("-").map(Number);
    $("#mes", w).textContent = MESES[m - 1].slice(0, 3) + " " + y;
    const g = $("#grid", w); g.innerHTML = ["do", "lu", "ma", "mi", "ju", "vi", "sá"].map(d => `<div class="dsem">${d}</div>`).join("");
    const primero = new Date(y, m - 1, 1); const ini = new Date(y, m - 1, 1 - primero.getDay());
    for (let i = 0; i < 42; i++) {
      const d = new Date(ini); d.setDate(ini.getDate() + i);
      if (i >= 35 && d.getMonth() !== m - 1) break;
      const k = ymd(d); const b = document.createElement("button"); b.type = "button";
      const fut = k > ymd(hoy);
      b.className = "dia" + (d.getDay() % 6 === 0 ? " finde" : "") + (d.getMonth() !== m - 1 ? " otro" : "") + (k === ymd(hoy) ? " hoy" : "") + (fut ? " fut" : "") + (k === S.actual.fecha && !fut ? " sel" : "");
      b.innerHTML = `<span>${d.getDate()}</span>`;
      b.setAttribute("aria-label", fechaLarga(k) + (fut ? ", no disponible" : "")); b.setAttribute("aria-pressed", k === S.actual.fecha);
      if (fut) { b.disabled = true; g.appendChild(b); continue; }
      b.onclick = () => { cambiarActual("fecha", k); S.mesVista = k.slice(0, 7); guardar(); $("#av", w).textContent = ""; pinta(); };
      g.appendChild(b);
    }
  };
  const mover = n => { const [y, m] = S.mesVista.split("-").map(Number); S.mesVista = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); pinta(); };
  $("#ma", w).onclick = () => mover(-1); $("#ms", w).onclick = () => mover(1);
  $("#aa", w).onclick = () => mover(-12); $("#as", w).onclick = () => mover(12);
  $("#atr", w).onclick = () => ir(0);
  if (S.actual.fecha && S.actual.fecha > ymd(hoy)) { cambiarActual("fecha", null); }
  $("#sig", w).onclick = () => { if (!S.actual.fecha) { $("#av", w).textContent = "Toca un día del calendario para seguir. No se pueden cargar días futuros."; return; } ir(2); };
  pinta();
}

/* ---------- 3. Punto ---------- */
function vPunto(w) {
  w.innerHTML = `
    <h1>¿En qué punto?</h1>
    <p class="sub">${esc(fechaLarga(S.actual.fecha))} · CC ${cedFmt(S.actual.cc)}</p>
    <label class="buscar"><span aria-hidden="true">⌕</span><span class="sr">Buscar tienda</span><input id="q" type="search" placeholder="Portal 80 o 108" autocomplete="off"></label>
    <div class="recientes" id="rec"></div>
    <div class="lista" id="lista" role="listbox" aria-label="Puntos de venta"></div>
    <p class="aviso" id="av"></p>
    <div class="pie"><button class="btn sec" id="atr" type="button">Atrás</button><button class="btn" id="sig" type="button">Continuar</button></div>`;
  const rec = $("#rec", w);
  (S.recientes || []).filter(p => PUNTOS.includes(p)).slice(0, 4).forEach(p => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = nombrePunto(p).nom;
    b.onclick = () => elegir(p); rec.appendChild(b);
  });
  const lista = $("#lista", w);
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const pinta = () => {
    const q = norm($("#q", w).value.trim());
    const f = PUNTOS.filter(p => !q || norm(p).includes(q));
    lista.innerHTML = f.length ? "" : `<p class="vacio-lista">No hay tiendas con “${esc($("#q", w).value)}”. Prueba con el número o parte del nombre.</p>`;
    f.forEach(p => {
      const n = nombrePunto(p); const b = document.createElement("button"); b.type = "button";
      b.className = "pv" + (p === S.actual.punto ? " sel" : ""); b.setAttribute("role", "option"); b.setAttribute("aria-selected", p === S.actual.punto);
      b.innerHTML = `<b>${n.cod}</b><span>${esc(n.nom)}</span>${p === S.actual.punto ? "✓" : ""}`;
      b.onclick = () => elegir(p); lista.appendChild(b);
    });
  };
  const elegir = p => {
    cambiarActual("punto", p); S.recientes = [p].concat((S.recientes || []).filter(x => x !== p)).slice(0, 4); guardar();
    $("#av", w).textContent = ""; pinta(); setTimeout(() => ir(3), 260);
  };
  $("#q", w).oninput = pinta;
  $("#atr", w).onclick = () => ir(1);
  $("#sig", w).onclick = () => { if (!S.actual.punto) { $("#av", w).textContent = "Elige una tienda de la lista para seguir."; return; } ir(3); };
  pinta();
  const s = $(".pv.sel", w); if (s) s.scrollIntoView({ block: "center" });
}

/* ---------- 4. Marcas de la persona ---------- */
function vMarcas(w) {
  const n = nombrePunto(S.actual.punto);
  const mias = deActual().sort((a, b) => a.hora.localeCompare(b.hora));
  w.innerHTML = `
    <div class="banda">
      <div class="txt"><div class="cc">CC ${cedFmt(S.actual.cc)}</div><div class="p">${esc(fechaCorta(S.actual.fecha))} · ${n.cod} ${esc(n.nom)}</div></div>
      <button type="button" id="cd">Cambiar</button>
    </div>
    <div class="resumen" aria-live="polite"><span><b>${mias.length}</b> ${mias.length === 1 ? "marca" : "marcas"} de esta persona</span></div>
    ${mias.length ? `<div class="marcas" id="lista"></div>` : `
    <div class="vacio"><img class="wave" data-k="yog" alt=""><h2>Agrega su ingreso y su salida</h2><p>Toca el botón + para agregar la primera marca.</p></div>`}
    <p class="aviso" id="av" style="position:absolute;left:24px;right:96px;bottom:74px"></p>
    <button class="fab" id="mas" type="button" aria-label="Agregar marca">+</button>
    <div class="barra"><button class="btn" id="listo" type="button">Listo con esta persona</button></div>`;
  const lista = $("#lista", w);
  mias.forEach((m, i) => {
    const d = document.createElement("div");
    d.className = "marca " + (m.tipo === "Ingreso" ? "ing" : "sal"); d.style.animationDelay = Math.min(i, 8) * 40 + "ms";
    d.innerHTML = `<img data-k="${m.tipo === "Ingreso" ? "uva2" : "man"}" alt="">
      <button type="button" class="info" style="text-align:left" aria-label="Editar ${m.tipo.toLowerCase()} de las ${m.hora}"><div class="t">${m.tipo}</div>${m.com ? `<div class="com">${esc(m.com)}</div>` : `<div class="c">Toca para editar</div>`}</button>
      <div class="hora">${m.hora}</div>
      <button type="button" class="borrar" aria-label="Borrar marca">✕</button>`;
    $(".info", d).onclick = () => hoja(m.id);
    $(".borrar", d).onclick = () => { S.marcas = S.marcas.filter(x => x.id !== m.id); guardar(); render(); toast("Marca borrada"); };
    lista.appendChild(d);
  });
  $("#cd", w).onclick = () => ir(1);
  $("#mas", w).onclick = () => hoja(null);
  $("#listo", w).onclick = () => { if (!mias.length) { $("#av", w).textContent = "Agrega al menos una marca con el +."; return; } ir(4); };
}

/* ---------- 5. Resumen: otro usuario o descargar ---------- */
function vResumen(w) {
  const ps = personas();
  const total = S.marcas.length;
  ["p0", "p1", "p2", "p3"].forEach(id => $("#" + id).className = "paso hecho");
  w.innerHTML = `
    <div class="celebra" aria-hidden="true"><img class="bob" data-k="uva2" alt=""><img class="wave" data-k="yog" alt=""><img class="wig" data-k="man" alt=""></div>
    <h1 style="text-align:center">¿Agregamos a alguien más?</h1>
    <p class="sub" style="text-align:center">${ps.length} ${ps.length === 1 ? "persona" : "personas"} · ${total} ${total === 1 ? "marca" : "marcas"} listas para el plano</p>
    <div class="personas" id="lista"></div>
    <div id="fb"></div>
    <div class="final">
      <button class="btn otro" id="otro" type="button"><img data-k="uva1" alt="">Agregar otro usuario</button>
      <button class="btn descargar" id="bajar" type="button">Descargar plano</button>
      <button type="button" id="limpiar" style="color:var(--gris);text-decoration:underline;font-size:13px;align-self:center">Empezar de nuevo</button>
      <div id="conf"></div>
    </div>`;
  const lista = $("#lista", w);
  ps.forEach((p, i) => {
    const n = nombrePunto(p.punto);
    const d = document.createElement("div"); d.className = "persona"; d.style.animationDelay = Math.min(i, 8) * 50 + "ms";
    d.innerHTML = `<div class="avatar"><img data-k="${i % 2 ? "man" : "uva2"}" alt=""></div>
      <button type="button" class="info" aria-label="Editar marcas de ${cedFmt(p.cc)}"><div class="cc">CC ${cedFmt(p.cc)}</div><div class="lug">${esc(fechaCorta(p.fecha))} · ${n.cod} ${esc(n.nom)}</div>
      <div class="mk">${p.marcas.slice().sort((a, b) => a.hora.localeCompare(b.hora)).map(m => `<span class="${m.tipo === "Ingreso" ? "i" : "s"}">${m.tipo} ${m.hora}</span>`).join("")}</div></button>
      <button type="button" class="borrar" aria-label="Quitar a ${cedFmt(p.cc)}">✕</button>`;
    $(".info", d).onclick = () => { S.actual = { cc: p.cc, fecha: p.fecha, punto: p.punto }; S.mesVista = p.fecha.slice(0, 7); ir(3); };
    $(".borrar", d).onclick = () => {
      $("#conf", w).innerHTML = `<div class="confirma"><span>¿Quitar las ${p.marcas.length} marcas de ${cedFmt(p.cc)}?</span><button class="no" type="button" id="cno">Cancelar</button><button class="si" type="button" id="csi">Quitar</button></div>`;
      $("#cno", w).onclick = () => $("#conf", w).innerHTML = "";
      $("#csi", w).onclick = () => { S.marcas = S.marcas.filter(m => !mismo(m, p)); guardar(); if (!S.marcas.length) { S.actual.cc = ""; S.paso = 0; guardar(); } render(); toast("Persona quitada"); };
    };
    lista.appendChild(d);
  });
  $("#otro", w).onclick = () => { S.actual.cc = ""; S.paso = 0; guardar(); render(); };
  $("#bajar", w).onclick = () => descargar(w);
  $("#limpiar", w).onclick = () => {
    $("#conf", w).innerHTML = `<div class="confirma"><span>¿Borrar las ${total} marcas y empezar otra carga?</span><button class="no" type="button" id="cno">Cancelar</button><button class="si" type="button" id="csi">Borrar todo</button></div>`;
    $("#cno", w).onclick = () => $("#conf", w).innerHTML = "";
    $("#csi", w).onclick = () => { S.marcas = []; S.actual = { cc: "", fecha: null, punto: null }; S.paso = 0; S.mesVista = ymd(hoy).slice(0, 7); guardar(); render(); };
  };
}

/* ---------- Hoja: nueva marca ---------- */
function hoja(id) {
  const app = $("#app");
  const ed = id ? S.marcas.find(m => m.id === id) : null;
  const mias = deActual();
  const ult = mias.slice().sort((a, b) => a.hora.localeCompare(b.hora)).pop();
  let tipo = ed ? ed.tipo : (ult && ult.tipo === "Ingreso" ? "Salida" : "Ingreso");
  let [hh, mm] = (ed ? ed.hora : (tipo === "Salida" ? "17:00" : "08:00")).split(":").map(Number);
  const velo = document.createElement("div"); velo.className = "velo";
  const h = document.createElement("div"); h.className = "hoja"; h.setAttribute("role", "dialog"); h.setAttribute("aria-modal", "true"); h.setAttribute("aria-labelledby", "ht");
  h.innerHTML = `
    <div class="asa"></div>
    <div class="hoja-cab"><h2 id="ht">${ed ? "Editar marca" : "Nueva marca"}</h2><button class="cerrar" type="button" id="x" aria-label="Cerrar">✕</button></div>
    <p class="sub" style="margin:0">CC ${cedFmt(S.actual.cc)} · ${esc(fechaCorta(S.actual.fecha))}</p>
    <div class="campo"><span class="etq">¿Ingreso o salida?</span>
      <div class="tipos">
        <button type="button" class="tipo i" data-t="Ingreso" aria-pressed="false"><img data-k="uva2" alt="">Ingreso</button>
        <button type="button" class="tipo s" data-t="Salida" aria-pressed="false"><img data-k="man" alt="">Salida</button>
      </div></div>
    <div class="campo"><span class="etq" id="lh">Hora</span>
      <div class="reloj" role="group" aria-labelledby="lh">
        <div class="rueda" id="rh" tabindex="0" aria-label="Hora"></div><span class="dos">:</span><div class="rueda" id="rm" tabindex="0" aria-label="Minutos"></div>
      </div>
      <div class="atajos">${["06:00", "07:00", "08:00", "14:00", "17:00", "22:00"].map(t => `<button type="button" class="chip" data-h="${t}">${t}</button>`).join("")}</div></div>
    <div class="campo"><label for="com">Comentario <span class="opc">(opcional)</span></label>
      <input class="inp com" id="com" maxlength="120" placeholder="Olvidó marcar la salida" value="${ed ? esc(ed.com || "") : ""}"></div>
    <p class="aviso" id="e-g"></p>
    <div class="pie" style="padding-bottom:0"><button class="btn" id="ok" type="button">${ed ? "Guardar cambios" : "Agregar marca"}</button></div>`;
  app.appendChild(velo); app.appendChild(h); pon(h);
  const cerrar = () => { velo.remove(); h.remove(); document.removeEventListener("keydown", tecla); const f = $("#mas"); if (f) f.focus(); };
  const tecla = e => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  velo.onclick = cerrar; $("#x", h).onclick = cerrar;

  const marcarTipo = t => { tipo = t; h.querySelectorAll(".tipo").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t)); };
  h.querySelectorAll(".tipo").forEach(b => b.onclick = () => marcarTipo(b.dataset.t));
  marcarTipo(tipo);

  const rueda = (el, n, val, set) => {
    el.innerHTML = `<div class="pad"></div>` + Array.from({ length: n }, (_, i) => `<div data-v="${i}">${String(i).padStart(2, "0")}</div>`).join("") + `<div class="pad"></div>`;
    const H = 44; let t;
    const marca = v => el.querySelectorAll("[data-v]").forEach(d => d.classList.toggle("on", +d.dataset.v === v));
    const a = (v, suave) => { el.scrollTo({ top: v * H, behavior: suave ? "smooth" : "auto" }); marca(v); set(v); el.setAttribute("aria-valuenow", v); };
    el.setAttribute("role", "spinbutton"); el.setAttribute("aria-valuemin", 0); el.setAttribute("aria-valuemax", n - 1);
    el.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => { const v = Math.max(0, Math.min(n - 1, Math.round(el.scrollTop / H))); marca(v); set(v); el.setAttribute("aria-valuenow", v); }, 90); });
    el.addEventListener("click", e => { const d = e.target.closest("[data-v]"); if (d) a(+d.dataset.v, true); });
    el.addEventListener("keydown", e => { const cur = Math.round(el.scrollTop / H); if (e.key === "ArrowUp") { e.preventDefault(); a((cur - 1 + n) % n, true); } if (e.key === "ArrowDown") { e.preventDefault(); a((cur + 1) % n, true); } });
    requestAnimationFrame(() => a(val, false));
    return a;
  };
  const ponH = rueda($("#rh", h), 24, hh, v => hh = v);
  const ponM = rueda($("#rm", h), 60, mm, v => mm = v);
  h.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { const [a, c] = b.dataset.h.split(":").map(Number); ponH(a, true); ponM(c, true); });

  $("#ok", h).onclick = () => {
    const hora = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    const com = $("#com", h).value.trim();
    if (S.marcas.some(m => mismo(m, S.actual) && m.tipo === tipo && m.hora === hora && m.id !== id)) { $("#e-g", h).textContent = "Esa marca ya está en la lista."; return; }
    if (ed) Object.assign(ed, { tipo, hora, com });
    else S.marcas.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo, hora, com }, S.actual));
    guardar(); cerrar(); render(); toast(ed ? "Cambios guardados" : tipo + " a las " + hora);
  };
  setTimeout(() => $("#ok", h).focus(), 350);
}

/* ---------- Excel (solo Hoja1, mismo formato del ejemplo) ---------- */
function filasOrdenadas() { return S.marcas.slice().sort((a, b) => a.cc.localeCompare(b.cc, undefined, { numeric: true }) || a.fecha.localeCompare(b.fecha) || a.hora.localeCompare(b.hora)); }
function fbCopiar(w, motivo) {
  const box = $("#fb", w);
  box.innerHTML = `<div class="fallback"><span>${motivo} Copia la tabla, pégala en la celda A1 de un Excel nuevo y guárdalo. Ese es el plano.</span><button type="button" id="cp">Copiar tabla</button></div>`;
  $("#cp", box).onclick = async () => {
    const filas = filasOrdenadas();
    const tsv = ["CC\tFecha\tHora\tTipo\tCentro de Costo\tComentario"].concat(filas.map(f => [f.cc, f.fecha, f.hora, f.tipo, f.punto, f.com || ""].join("\t"))).join("\n");
    const td = (v, fmt) => `<td${fmt ? ` style="mso-number-format:'${fmt}'"` : ""}>${esc(v)}</td>`;
    const html = `<table><tr>${["CC", "Fecha", "Hora", "Tipo", "Centro de Costo", "Comentario"].map(h => td(h)).join("")}</tr>` + filas.map(f => `<tr>${td(f.cc, "0")}${td(f.fecha, "mm\\-dd\\-yy")}${td(f.hora, "h\\:mm")}${td(f.tipo)}${td(f.punto, "\\@")}${td(f.com || "")}</tr>`).join("") + `</table>`;
    try { await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([tsv], { type: "text/plain" }) })]); toast("Tabla copiada"); return; } catch (e) {}
    try { await navigator.clipboard.writeText(tsv); toast("Tabla copiada"); }
    catch (e) { const t = document.createElement("textarea"); t.value = tsv; t.style.cssText = "width:100%;height:90px;font-size:12px;border-radius:10px;border:1px solid var(--linea)"; box.firstChild.appendChild(t); t.select(); toast("Selecciona y copia el texto"); }
  };
}
async function descargar(w) {
  if (!S.marcas.length) { toast("Agrega al menos una marca"); return; }
  if (!window.XLSX) { fbCopiar(w, "No se pudo preparar el Excel."); return; }
  const filas = filasOrdenadas();
  const ws = XLSX.utils.aoa_to_sheet([["CC", "Fecha", "Hora", "Tipo", "Centro de Costo", "Comentario"]]);
  filas.forEach((f, i) => {
    const r = i + 2; const [hh, mi] = f.hora.split(":").map(Number); const [y, m, d] = f.fecha.split("-").map(Number);
    ws["A" + r] = { t: "n", v: Number(f.cc) };
    ws["B" + r] = { t: "n", v: (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000, z: "mm-dd-yy" };
    ws["C" + r] = { t: "n", v: (hh * 60 + mi) / 1440, z: "h:mm" };
    ws["D" + r] = { t: "s", v: f.tipo };
    ws["E" + r] = { t: "s", v: f.punto };
    ws["F" + r] = { t: "s", v: f.com || "" };
  });
  ws["!ref"] = "A1:F" + (filas.length + 1);
  ws["!cols"] = [{ wch: 14 }, { wch: 11 }, { wch: 8 }, { wch: 10 }, { wch: 30 }, { wch: 36 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Hoja1");
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const fechas = [...new Set(filas.map(f => f.fecha))].sort();
  const nombre = "Carga_marcas_" + fechas[0] + (fechas.length > 1 ? "_a_" + fechas[fechas.length - 1] : "") + ".xlsx";
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: nombre, data: new Blob([buf]) }); toast("Plano descargado"); }
    catch (e) {
      if (e && e.code === "declined") toast("Descarga cancelada");
      else if (e && e.code === "rate_limited") toast("Espera un momento y vuelve a intentar");
      else fbCopiar(w, "La descarga no está disponible en esta vista.");
    }
  } else if (window.claude && window.claude.use) {
    fbCopiar(w, "La descarga solo está disponible para miembros de la organización.");
  } else {
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf])); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); toast("Plano descargado"); }
    catch (e) { fbCopiar(w, "La descarga no está disponible aquí."); }
  }
}

render();
</script>
